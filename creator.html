<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNCR2 — カード作成 (Creator)</title>
<!-- 外部依存は §8 の方針どおり最小限。PDF 出力は任意機能（無くても PNG 保存は動く）。 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" onerror="window.__noJsPDF=true"></script>
<!-- SNCR2 コア（すべてローカル・外部送信なし） -->
<script src="js/vendor/pako.min.js"></script>
<script src="js/qr-geometry.js"></script>
<script src="js/qr-align.js"></script>
<script src="js/qr-rs.js"></script>
<script src="js/qr-version.js"></script>
<script src="js/qr-interleave.js"></script>
<script src="js/qr-mask.js"></script>
<script src="js/qr-header.js"></script>
<script src="js/qr-core.js"></script>
<script src="js/card-format.js"></script>
<script src="js/compress.js"></script>
<style>
  :root { --accent:#2563eb; --ok:#16a34a; --bg:#0f172a; --card:#1e293b; --line:#334155; }
  * { box-sizing:border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
         margin:0; background:var(--bg); color:#e2e8f0; padding:16px; }
  .wrap { max-width:820px; margin:0 auto; }
  h1 { font-size:1.35rem; margin:.2em 0; }
  .sub { color:#94a3b8; font-size:.85rem; margin-bottom:1rem; line-height:1.5; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:.85rem; color:#cbd5e1; margin:.4rem 0 .2rem; }
  input[type=file], select { width:100%; padding:10px; border-radius:8px; border:1px solid var(--line);
           background:#0b1220; color:#e2e8f0; font-size:1rem; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:140px; }
  button { cursor:pointer; border:0; border-radius:9px; padding:12px 14px; font-size:1rem; font-weight:600;
           color:#fff; background:var(--accent); width:100%; }
  button.ok { background:var(--ok); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .info { font-size:.85rem; color:#93c5fd; margin:8px 0; white-space:pre-line; }
  .previews { display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; }
  .previews figure { margin:0; background:#fff; padding:6px; border-radius:8px; }
  .previews canvas { display:block; width:150px; height:auto; }
  .previews figcaption { color:#0f172a; font-size:.7rem; text-align:center; margin-top:4px; }
  code { background:#0b1220; padding:2px 6px; border-radius:5px; }
  a.homelink { color:#93c5fd; font-size:.85rem; }
  label.chk { display:flex; align-items:center; gap:8px; font-size:.9rem; color:#cbd5e1; margin:.4rem 0 .2rem; }
  label.chk input { width:auto; }
  .hint { font-size:.78rem; color:#94a3b8; margin:4px 0 6px; }
  .warn { border-left:3px solid #f59e0b; padding:6px 10px; background:#0b1220; border-radius:6px; font-size:.8rem; }
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>📇</text></svg>">
</head>
<body>
<div class="wrap">
  <h1>📇 SNCR2 — カード作成</h1>
  <div class="sub">
    任意のバイナリ → A4/300dpi の QR 風カード画像に変換して印刷します。<br>
    <b>推奨: スキャナ読み取り</b>（正面・等倍・300dpi）／ カメラ撮影は非推奨。<br>
    1 ページの正味容量 <b id="capLbl">—</b>。超える分は自動で複数ページに分割します。
    <a class="homelink" href="decoder.html">→ 読み取り(Decoder)へ</a>
  </div>

  <div class="panel">
    <label>① ファイルを選択（テキスト・画像・zip 等なんでも可）</label>
    <input type="file" id="file">
    <div class="row" style="margin-top:12px;">
      <div>
        <label>② 密度（独自バージョン＝cols×rows）</label>
        <select id="ver"></select>
      </div>
      <div>
        <label>③ 誤り訂正（汚れ・かすれ耐性）</label>
        <select id="ecc">
          <option value="0">なし（訂正0%・最大容量）</option>
          <option value="1">低（約10%）</option>
          <option value="2">中（約20%）</option>
          <option value="3" selected>高（約30%・推奨）</option>
        </select>
      </div>
    </div>
    <label class="chk" style="margin-top:10px;"><input type="checkbox" id="compress" checked> 圧縮する（deflate/gzip/brotli/日本語辞書から自動選択・可逆）</label>
    <div class="hint">圧縮は完全可逆で、展開後に元データと一致するか自己検証します。テキストや構造化データで特に効きます。</div>
  </div>

  <div class="panel">
    <button id="go">④ カード画像を生成</button>
    <div class="info" id="info"></div>
    <div class="row" style="margin-top:10px;">
      <button id="dlPng" class="ok" disabled>PNG を保存</button>
      <button id="dlPdf" class="ok" disabled>PDF を保存（全ページ）</button>
    </div>
    <div class="warn" style="margin-top:10px;">⚠ 必ず<b>二値（白黒）</b>でモノクロ印刷してください。グレースケール/カラーは互換性が損なわれます。</div>
    <div class="previews" id="previews"></div>
  </div>
</div>

<script>
'use strict';
const CF = window.CardFormat;
const Ver = window.SNCR2Version;
const Core = window.SNCR2Core;

// ---- 版セレクタを埋める ----
const verSel = document.getElementById('ver');
CF.VERSIONS.forEach(v => {
  const prof = CF.getProfile(v);
  const o = document.createElement('option');
  o.value = v;
  o.textContent = `ver${v}（${prof.COLS}×${prof.ROWS}・約${prof.minCellMm.toFixed(2)}mm・グロス${prof.grossBytes}B）`;
  if (v === CF.VERSIONS[CF.VERSIONS.length - 1]) o.selected = true; // 既定は最大版(≈10KB)
  verSel.appendChild(o);
});

function updateCap() {
  const v = +verSel.value, ecc = +document.getElementById('ecc').value;
  const prof = CF.getProfile(v);
  const net = CF.netCapacity(prof, ecc);
  document.getElementById('capLbl').textContent = `${net} バイト（ver${v}・ECC${['なし','低','中','高'][ecc]}）`;
}
verSel.addEventListener('change', updateCap);
document.getElementById('ecc').addEventListener('change', updateCap);
updateCap();

// ==================================================================
//  1 ページぶんの encodePage 結果をフルサイズ canvas へ描画する。
//  レイアウト: 四隅ファインダ（塗りつぶし正方形） + データグリッド箱 +
//  人間可読フッタ。decode-core の四隅検出・箱寸法（§2）と厳密に一致させる。
// ==================================================================
function renderPage(enc, footerText) {
  const prof = enc.prof;
  const cv = document.createElement('canvas');
  cv.width = CF.PAGE_W; cv.height = CF.PAGE_H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#000';

  // 四隅ファインダ（旧 cardloader と同じ塗りつぶし正方形。連結成分検出用）。
  const half = CF.FINDER / 2;
  const cx0 = CF.QUIET + half, cy0 = CF.QUIET + half;
  const cx1 = CF.PAGE_W - CF.QUIET - half;
  const cy1 = CF.GRID_Y + CF.GRID_H + CF.GAP + half;
  const finders = [ {x:cx0,y:cy0}, {x:cx1,y:cy0}, {x:cx1,y:cy1}, {x:cx0,y:cy1} ];
  for (const f of finders) ctx.fillRect(f.x - half, f.y - half, CF.FINDER, CF.FINDER);

  // データグリッド（黒セルのみ塗る）。
  for (let r = 0; r < prof.ROWS; r++) {
    for (let c = 0; c < prof.COLS; c++) {
      if (enc.modules[r * prof.COLS + c]) {
        const rect = CF.cellRect(prof, c, r);
        // 0.5px 内側に描くと隣接セルの滲み・重なりを避けられる（旧 cardloader 踏襲）。
        ctx.fillRect(rect.x + 0.5, rect.y + 0.5, rect.w - 1, rect.h - 1);
      }
    }
  }

  // 人間可読フッタ。
  ctx.fillStyle = '#000';
  ctx.font = '28px sans-serif';
  ctx.textAlign = 'center';
  const footerY = CF.GRID_Y + CF.GRID_H + CF.GAP + CF.FINDER + 40;
  ctx.fillText(footerText, CF.PAGE_W / 2, footerY);
  return cv;
}

let generatedCanvases = [];

document.getElementById('go').addEventListener('click', async () => {
  const fileInput = document.getElementById('file');
  const info = document.getElementById('info');
  if (!fileInput.files.length) { info.textContent = 'ファイルを選択してください。'; return; }
  info.textContent = '生成中…';
  document.getElementById('dlPng').disabled = true;
  document.getElementById('dlPdf').disabled = true;

  const file = fileInput.files[0];
  let bytes = new Uint8Array(await file.arrayBuffer());
  const origLen = bytes.length;

  // 圧縮（任意・可逆）。compress.js の自動選択コンテナを使う。
  let compressedNote = '';
  if (document.getElementById('compress').checked && window.NaidesuCompress) {
    try {
      const res = await window.NaidesuCompress.compress(bytes);
      // compress() は常に「圧縮コンテナ」を返す（効果が無ければ STORE で格納）。
      // decoder 側は autoDecompress でコンテナを自動判別・展開する。
      bytes = res.container;
      compressedNote = res.method === window.NaidesuCompress.METHOD.STORE
        ? `（圧縮効果なし・STORE で格納 ${bytes.length}B）`
        : `（${res.methodName} 圧縮 ${origLen}B → ${bytes.length}B）`;
    } catch (e) { compressedNote = '（圧縮スキップ: ' + e.message + '）'; }
  }

  const ver = +verSel.value;
  const ecc = +document.getElementById('ecc').value;

  // §2-1「A4 1 枚を主目標」。指定版に収まらなければ複数ページへ自動分割。
  const { pages, totalPages, perPageNet } = CF.encodeFile(bytes, { version: ver, eccLevel: ecc });

  // プレビュー + フルサイズ canvas 生成。
  const previews = document.getElementById('previews');
  previews.innerHTML = '';
  generatedCanvases = [];
  for (let p = 0; p < pages.length; p++) {
    const footer = `SNCR2 v${ver} ECC${['N','L','M','H'][ecc]}  page ${p + 1}/${totalPages}  ${file.name}`;
    const full = renderPage(pages[p], footer);
    generatedCanvases.push(full);

    const small = document.createElement('canvas');
    small.width = 150; small.height = Math.round(150 * CF.PAGE_H / CF.PAGE_W);
    small.getContext('2d').drawImage(full, 0, 0, small.width, small.height);
    const fig = document.createElement('figure');
    const cap = document.createElement('figcaption');
    cap.textContent = `page ${p + 1}/${totalPages}`;
    fig.appendChild(small); fig.appendChild(cap);
    previews.appendChild(fig);
  }

  info.textContent =
    `完了。${file.name}（元 ${origLen}B）${compressedNote}\n` +
    `ver${ver} / ECC${['なし','低','中','高'][ecc]} / 1ページ正味 ${perPageNet}B / 全 ${totalPages} ページ。\n` +
    `推奨: スキャナで 300dpi・二値（白黒）で読み取ってください。`;

  document.getElementById('dlPng').disabled = false;
  document.getElementById('dlPdf').disabled = (totalPages < 1) || window.__noJsPDF;
});

// PNG 保存（複数ページは連番ダウンロード）。
document.getElementById('dlPng').addEventListener('click', () => {
  generatedCanvases.forEach((cv, i) => {
    const a = document.createElement('a');
    a.download = `sncr2_page${i + 1}.png`;
    a.href = cv.toDataURL('image/png');
    a.click();
  });
});

// PDF 保存（全ページを 1 ファイルに）。jsPDF が読めた環境のみ。
document.getElementById('dlPdf').addEventListener('click', () => {
  if (window.__noJsPDF || !window.jspdf) { alert('PDF 出力は利用できません（PNG 保存を使ってください）。'); return; }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'px', format: [CF.PAGE_W, CF.PAGE_H] });
  generatedCanvases.forEach((cv, i) => {
    if (i > 0) pdf.addPage([CF.PAGE_W, CF.PAGE_H]);
    pdf.addImage(cv.toDataURL('image/png'), 'PNG', 0, 0, CF.PAGE_W, CF.PAGE_H);
  });
  pdf.save('sncr2.pdf');
});
</script>
</body>
</html>
