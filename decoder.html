<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNCR2 — カード読み取り (Decoder)</title>
<script src="js/vendor/pako.min.js"></script>
<script src="js/qr-geometry.js"></script>
<script src="js/qr-align.js"></script>
<script src="js/qr-rs.js"></script>
<script src="js/qr-version.js"></script>
<script src="js/qr-interleave.js"></script>
<script src="js/qr-mask.js"></script>
<script src="js/qr-header.js"></script>
<script src="js/qr-core.js"></script>
<script src="js/card-format.js"></script>
<script src="js/compress.js"></script>
<script src="js/geometry.js"></script>
<script src="js/decode-core.js"></script>
<style>
  :root { --accent:#2563eb; --ok:#16a34a; --err:#dc2626; --bg:#0f172a; --card:#1e293b; --line:#334155; }
  * { box-sizing:border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
         margin:0; background:var(--bg); color:#e2e8f0; padding:16px; }
  .wrap { max-width:820px; margin:0 auto; }
  h1 { font-size:1.35rem; margin:.2em 0; }
  .sub { color:#94a3b8; font-size:.85rem; margin-bottom:1rem; line-height:1.5; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .drop { border:2px dashed var(--line); border-radius:12px; padding:34px 16px; text-align:center; color:#94a3b8; cursor:pointer; }
  .drop.hover { border-color:var(--accent); color:#cbd5e1; }
  button { cursor:pointer; border:0; border-radius:9px; padding:12px 14px; font-size:1rem; font-weight:600; color:#fff; background:var(--accent); width:100%; }
  button.ok { background:var(--ok); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .info { font-size:.85rem; margin:8px 0; white-space:pre-line; }
  .info.ok { color:#86efac; } .info.err { color:#fca5a5; }
  a.homelink { color:#93c5fd; font-size:.85rem; }
  .warn { border-left:3px solid #f59e0b; padding:6px 10px; background:#0b1220; border-radius:6px; font-size:.8rem; margin-top:8px; }
  .thumbs { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .thumbs img { width:120px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  input[type=file]{ display:none; }
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>🔍</text></svg>">
</head>
<body>
<div class="wrap">
  <h1>🔍 SNCR2 — カード読み取り</h1>
  <div class="sub">
    印刷済みカードのスキャン画像から元ファイルを復元します。<br>
    <b>推奨: スキャナ（300dpi・正面・等倍・平面固定）</b>。カメラ撮影は動作しますが非推奨です
    （傾き・光量ムラ・手ブレで 0.7mm 級セルは失敗しやすい）。<br>
    複数ページは全ページの画像をまとめて選ぶと自動結合します。
    <a class="homelink" href="creator.html">→ 作成(Creator)へ</a>
  </div>

  <div class="panel">
    <div class="drop" id="drop">画像をここにドロップ、またはクリックして選択（複数可）<br><small>PNG / JPEG など</small></div>
    <input type="file" id="file" accept="image/*" multiple>
    <div class="thumbs" id="thumbs"></div>
    <div class="warn">スキャンは<b>白黒（二値）</b>を想定しています。カラー/グレースケールでも大津法で二値化しますが、
    可能な限りモノクロ 300dpi で取り込んでください。</div>
  </div>

  <div class="panel">
    <button id="go" disabled>復元する</button>
    <div class="info" id="info"></div>
    <button id="dl" class="ok" disabled style="margin-top:10px;">復元ファイルを保存</button>
  </div>
</div>

<script>
'use strict';
const CF = window.CardFormat;
const DC = window.SNCR2DecodeCore;

let images = [];       // {name, imageData}
let restored = null;   // {data, name}

const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const info = document.getElementById('info');
const thumbs = document.getElementById('thumbs');

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('hover'); });
drop.addEventListener('dragleave', () => drop.classList.remove('hover'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('hover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => handleFiles(fileInput.files));

async function handleFiles(fileList) {
  images = []; thumbs.innerHTML = ''; restored = null;
  document.getElementById('dl').disabled = true;
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  for (const f of files) {
    const url = URL.createObjectURL(f);
    const img = await loadImage(url);
    const imageData = imageToData(img);
    images.push({ name: f.name, imageData });
    const el = document.createElement('img');
    el.src = url; thumbs.appendChild(el);
  }
  info.className = 'info';
  info.textContent = `${images.length} 枚の画像を読み込みました。`;
  document.getElementById('go').disabled = images.length === 0;
}

function loadImage(url) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = url;
  });
}
function imageToData(img) {
  const cv = document.createElement('canvas');
  cv.width = img.naturalWidth; cv.height = img.naturalHeight;
  const ctx = cv.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const id = ctx.getImageData(0, 0, cv.width, cv.height);
  return { data: id.data, width: cv.width, height: cv.height };
}

document.getElementById('go').addEventListener('click', async () => {
  info.className = 'info';
  info.textContent = '解析中…（版ごとに試し読みしています）';
  await new Promise(r => setTimeout(r, 20));

  const results = [];
  for (let i = 0; i < images.length; i++) {
    const r = DC.decodeAnyVersion(images[i].imageData);
    results.push(r);
  }
  const okPages = results.filter(r => r && r.ok);
  if (okPages.length === 0) {
    info.className = 'info err';
    const why = results.map((r, i) => `page${i + 1}: ${r ? (r.reason || ('ver' + r.version + ' 未確定')) : '失敗'}`).join('\n');
    info.textContent = '復元に失敗しました。スキャン品質（300dpi・二値・正面）をご確認ください。\n' + why;
    return;
  }

  // 複数ページ結合。
  const asm = CF.assembleFile(okPages);
  let data = asm.data;
  if (!data) {
    info.className = 'info err';
    info.textContent = 'ページの結合に失敗しました（ページ抜け？）。';
    return;
  }

  // 圧縮コンテナなら自動展開（可逆・自己検証つき）。
  let note = '';
  if (window.NaidesuCompress) {
    try {
      const de = await window.NaidesuCompress.autoDecompress(data);
      data = de.data;
      note = de.wasCompressed ? `（${de.methodName} 展開）` : '（無圧縮）';
    } catch (e) { note = '（展開エラー: ' + e.message + '）'; }
  }

  restored = { data, name: (okPages[0].meta && okPages[0].meta.name) || 'sncr2_restored.bin' };
  info.className = 'info ok';
  const corr = okPages.reduce((s, r) => s + (r.corrected || 0), 0);
  info.textContent =
    `復元成功 ✅ ${data.length} バイト ${note}\n` +
    `ページ ${okPages.length}/${images.length}・訂正セル合計 ${corr}・` +
    `ver${okPages[0].version}/ECC${['なし','低','中','高'][okPages[0].eccLevel]}。`;
  document.getElementById('dl').disabled = false;
});

document.getElementById('dl').addEventListener('click', () => {
  if (!restored) return;
  const blob = new Blob([restored.data], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.download = restored.name;
  a.href = URL.createObjectURL(blob);
  a.click();
});
</script>
</body>
</html>
